<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 600">
  <defs>
    <pattern id="check" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(-4)">
      <rect width="40" height="40" fill="#fff"/>
      <path d="M0 6H40M6 0V40" stroke="#111" stroke-width="4"/>
    </pattern>
    <clipPath id="faceClip">
      <path d="M112 200C112 140 156 110 216 110S320 140 320 200V262C320 290 312 312 296 332L262 366C248 376 236 380 216 380S184 376 170 366L136 332C120 312 112 290 112 262Z"/>
    </clipPath>
  </defs>

  <!-- shirt -->
  <path d="M20 600C28 480 88 424 166 404L216 476 266 404C344 424 404 480 412 600Z" fill="url(#check)" stroke="#000" stroke-width="8" stroke-linejoin="round"/>

  <!-- mullet: back tails behind the jaw -->

  <!-- neck -->
  <path d="M166 334V408L216 476 266 408V334Z" fill="#B98254" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
  <path d="M168 350C198 382 234 382 264 350V372C234 400 198 400 168 372Z" fill="#9C6A41"/>

  <!-- collars -->
  <path d="M164 400L92 440 148 482 216 484Z" fill="url(#check)" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
  <path d="M268 400L340 440 284 482 216 484Z" fill="url(#check)" stroke="#000" stroke-width="8" stroke-linejoin="round"/>

  <!-- ears -->
  <ellipse cx="110" cy="248" rx="16" ry="25" fill="#C48B5A" stroke="#000" stroke-width="8"/>
  <ellipse cx="322" cy="248" rx="16" ry="25" fill="#C48B5A" stroke="#000" stroke-width="8"/>

  <!-- face with defined jaw -->
