  <!-- cheekbone + jaw shading -->
  <path d="M128 268C136 300 150 322 176 344C156 330 138 308 128 268ZM304 268C296 300 282 322 256 344C276 330 294 308 304 268Z" fill="#A8703F" opacity=".5"/>
  <path d="M142 268C150 276 160 282 172 284M290 268C282 276 272 282 260 284" fill="none" stroke="#A8703F" stroke-width="5" stroke-linecap="round" opacity=".7"/>

  <!-- light stubble along the jaw -->
  <g clip-path="url(#faceClip)">
    <path d="M100 232C112 270 140 292 172 302C190 296 242 296 260 302 292 292 320 270 332 232V400H100Z" fill="#1F1A17" opacity=".95"/>
  </g>
  <ellipse cx="216" cy="336" rx="30" ry="12" fill="#B67A4C"/>

  <!-- mullet top: tall textured quiff, short sides -->
  <path d="M112 198C104 130 140 84 216 82C292 80 330 128 320 198C318 176 312 160 304 150L292 160 280 146 262 158 246 144 228 158 210 146 190 160 172 148 150 164 132 156C120 168 114 184 112 198Z" fill="#0B0B0B" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
  <path d="M112 196C110 220 112 240 118 254L126 232C122 218 122 204 124 190ZM320 196C322 220 320 240 314 254L306 232C310 218 310 204 308 190Z" fill="#0B0B0B" opacity=".45"/>
  <path d="M150 110C180 94 240 90 290 112M170 128C210 116 260 118 296 134M200 96L210 118M240 92L250 116" fill="none" stroke="#3a3a3a" stroke-width="5" stroke-linecap="round"/>

  <!-- eyebrows -->
  <path d="M140 214C158 202 184 200 204 210" fill="none" stroke="#000" stroke-width="11" stroke-linecap="round"/>
  <path d="M228 210C248 200 274 202 292 214" fill="none" stroke="#000" stroke-width="11" stroke-linecap="round"/>

  <!-- eyes -->
  <path d="M146 242Q172 228 198 242Q172 256 146 242Z" fill="#fff" stroke="#000" stroke-width="5"/>
  <path d="M234 242Q260 228 286 242Q260 256 234 242Z" fill="#fff" stroke="#000" stroke-width="5"/>
  <circle cx="172" cy="242" r="8" fill="#000"/>
  <circle cx="260" cy="242" r="8" fill="#000"/>
  <circle cx="175" cy="239" r="2.5" fill="#fff"/>
  <circle cx="263" cy="239" r="2.5" fill="#fff"/>
  <path d="M146 242Q172 226 198 242M234 242Q260 226 286 242" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round"/>

  <!-- nose -->
  <path d="M208 250C206 276 202 288 198 296 208 304 224 304 234 296 230 288 226 276 224 250" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- moustache -->
  <path d="M166 318C190 298 206 312 216 310 226 312 242 298 266 318 242 326 228 320 216 320 204 320 190 326 166 318Z" fill="#0B0B0B"/>

  <!-- smile -->
  <path d="M196 338Q216 352 236 338" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round"/>
</svg>
